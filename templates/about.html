<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title data-l10n-id="meta-about-title"></title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="description" data-l10n-attr="content:meta-about-description">
<meta name="htmx-config" content='{"globalViewTransitions":false}'>
<link rel="icon" href="assets/logo_ready_cargo_packer_large.svg" type="image/svg+xml">
<link rel="stylesheet" href="css/pages.css">
<script src="assets/js/htmx.min.js" defer data-build-only></script>
</head>
<body hx-boost="true" data-page="about">

  <div hx-get="partials/header.html" hx-trigger="load" hx-swap="outerHTML" style="min-height:var(--header-h)"></div>

  <main>
    <section class="about-page">
      <div class="container page-head-row">
        <div class="page-head-text">
          <span class="eyebrow" data-l10n-id="about-eyebrow"></span>
          <h1 data-l10n-id="about-heading"></h1>
        </div>
        <img class="page-head-illustration" src="assets/illustrations/animated/automatic-forklift_animated.svg" alt="" aria-hidden="true">
      </div>
    </section>
  </main>

  <div hx-get="partials/footer.html" hx-trigger="load" hx-swap="outerHTML"></div>

</body>
</html>
