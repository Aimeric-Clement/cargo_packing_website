<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title data-l10n-id="meta-roadmap-title"></title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="description" data-l10n-attr="content:meta-roadmap-description">
<meta name="htmx-config" content='{"globalViewTransitions":false}'>
<link rel="icon" href="assets/logo_ready_cargo_packer_large.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bebas+Neue&display=swap">
<link rel="stylesheet" href="css/style.css">
<script src="assets/js/htmx.min.js" defer data-build-only></script>
</head>
<body hx-boost="true" data-page="roadmap">

  <div hx-get="partials/header.html" hx-trigger="load" hx-swap="outerHTML" style="min-height:var(--header-h)"></div>

  <main>

    <section class="roadmap-page-head">
      <div class="container roadmap-head-row">
        <div class="roadmap-head-text">
          <span class="eyebrow" data-l10n-id="roadmap-eyebrow"></span>
          <h1 data-l10n-id="roadmap-heading"></h1>
          <p class="hero-lede" data-l10n-id="roadmap-description"></p>
        </div>
        <img class="roadmap-head-illustration" src="assets/illustrations/large-partially-open-boxes.svg" alt="" aria-hidden="true">
      </div>
    </section>

    <section class="roadmap-panel">
      <div class="container">
        <div class="roadmap-columns">
          <div class="roadmap-column">
            <div class="roadmap-column-head">
              <h2><span data-l10n-id="roadmap-finished-heading"></span> <span class="badge roadmap-count"></span></h2>
            </div>
            <div hx-get="partials/roadmap-done.html" hx-trigger="load" hx-swap="innerHTML">
              <p data-l10n-id="roadmap-loading"></p>
            </div>
          </div>

          <div class="roadmap-column">
            <div class="roadmap-column-head">
              <h2><span data-l10n-id="roadmap-upcoming-heading"></span> <span class="badge roadmap-count"></span></h2>
            </div>
            <div hx-get="partials/roadmap-next.html" hx-trigger="load" hx-swap="innerHTML">
              <p data-l10n-id="roadmap-loading"></p>
            </div>
          </div>
        </div>
        <p class="roadmap-note" data-l10n-id="roadmap-note"></p>
      </div>
    </section>

    <section class="cta-band">
      <div class="container">
        <h2 data-l10n-id="roadmap-cta-heading"></h2>
        <p data-l10n-id="roadmap-cta-description"></p>
        <a class="btn btn-primary" href="contact.html" data-l10n-id="roadmap-cta-link"></a>
      </div>
    </section>

  </main>

  <div hx-get="partials/footer.html" hx-trigger="load" hx-swap="outerHTML"></div>

  <script data-build-only>
    // Fill in each column's badge with the number of items its partial loaded.
    document.body.addEventListener('htmx:afterSwap', (event) => {
      const column = event.target.closest('.roadmap-column');
      const badge = column && column.querySelector('.roadmap-count');
      if (badge) badge.textContent = `(${column.querySelectorAll('.roadmap-item').length})`;
    });
  </script>

</body>
</html>
